[project]
name = "kitchen-cctv-agent"
version = "0.1.0"
description = "Zero-API-cost, evidence-first kitchen CCTV question answering"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "mlx-vlm>=0.3.9",
  "opencv-python>=4.10,<5",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
